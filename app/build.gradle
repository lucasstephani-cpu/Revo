plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.lucxs.revo'
    compileSdk 35

    defaultConfig {
        applicationId "dev.lucxs.revo"
        // 26 (Oreo): TYPE_APPLICATION_OVERLAY, the non-deprecated overlay
        // window type, only exists from API 26 on. Below that there's only
        // TYPE_PHONE, which needs a different permission story and is
        // removed from platform docs - not worth supporting for a fresh app.
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
